<!DOCTYPE html>
<html>
<head>
  <title>Your Destination - Live Tracking</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />

  <!-- Leaflet JS (YOU MISSED THIS) -->
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

  <style>
    #map {
      height: 100vh;
      width: 100%;
    }
  </style>
</head>
<body>

<!-- Map container (YOU MISSED THIS) -->
<div id="map"></div>

<script>
  let map;
  let marker;
  let currentPosition = [13.3409, 77.1010];

  function initMap() {
    map = L.map('map').setView([13.3409, 77.1010], 13);

    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
      attribution: '© OpenStreetMap contributors, © CARTO'
    }).addTo(map);

    let busIcon = L.icon({
      iconUrl: 'https://cdn-icons-png.flaticon.com/512/61/61231.png',
      iconSize: [35, 35]
    });

    marker = L.marker(currentPosition, { icon: busIcon }).addTo(map);

    loadRoute();

    setInterval(updateLocation, 3000);
  }

  async function loadRoute() {
    try {
      const res = await fetch("http://127.0.0.1:8000/api/routes/1/stops");
      const data = await res.json();

      let latlngs = [];

      data.stops.forEach(stop => {
        let latlng = [stop.latitude, stop.longitude];

        L.marker(latlng)
          .addTo(map)
          .bindPopup(stop.name);

        latlngs.push(latlng);
      });

      if (latlngs.length > 0) {
        let routeLine = L.polyline(latlngs, { color: 'blue' }).addTo(map);
        map.fitBounds(routeLine.getBounds());
      }

    } catch (err) {
      console.log("Route error:", err);
    }
  }

  async function updateLocation() {
    try {
      const res = await fetch("http://127.0.0.1:8000/api/location/1");
      const data = await res.json();

      let newPosition = [data.latitude, data.longitude];

      animateMarker(currentPosition, newPosition);

      currentPosition = newPosition;

    } catch (err) {
      console.log("Tracking error:", err);
    }
  }

  function animateMarker(start, end) {
    let steps = 50;
    let i = 0;

    let latStep = (end[0] - start[0]) / steps;
    let lngStep = (end[1] - start[1]) / steps;

    let interval = setInterval(() => {
      if (i >= steps) {
        clearInterval(interval);
        return;
      }

      let lat = start[0] + latStep * i;
      let lng = start[1] + lngStep * i;

      marker.setLatLng([lat, lng]);

      i++;
    }, 50);
  }

  window.onload = initMap;
  loadRoute();
</script>

</body>
</html>
